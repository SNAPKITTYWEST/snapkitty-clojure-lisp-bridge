<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lisp Machine — Interactive REPL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(0, 0, 0, 0.8);
      border-bottom: 2px solid #0d7;
      padding: 20px;
    }
    h1 {
      font-size: 2em;
      color: #0d7;
      margin-bottom: 5px;
      text-shadow: 0 0 20px rgba(0, 221, 119, 0.3);
    }
    .subtitle { color: #888; font-size: 0.9em; margin-bottom: 10px; }
    .status-bar { display: flex; gap: 20px; font-size: 0.85em; }
    .status-item { display: flex; gap: 8px; align-items: center; }
    .status-indicator { width: 8px; height: 8px; border-radius: 50%; background: #f44; }
    .status-indicator.ready { background: #0d7; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%; }
    .panel { background: rgba(45, 45, 48, 0.95); border: 1px solid #444; border-radius: 8px; display: flex; flex-direction: column; }
    .panel-header { background: rgba(20, 20, 20, 0.9); border-bottom: 1px solid #444; padding: 12px 16px; font-weight: bold; color: #0d7; }
    .panel-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    textarea { width: 100%; height: 200px; background: #1e1e1e; color: #0d7; border: 1px solid #333; border-radius: 4px; padding: 12px; font-family: monospace; resize: none; outline: none; }
    textarea:focus { border-color: #0d7; }
    .button-group { display: flex; gap: 8px; margin: 12px; }
    button { flex: 1; padding: 10px 16px; background: #0d7; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #0fa; }
    #output { flex: 1; background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 12px; font-size: 0.85em; color: #0d7; white-space: pre-wrap; overflow-y: auto; margin: 12px; }
    footer { background: rgba(0, 0, 0, 0.6); border-top: 1px solid #333; padding: 12px 20px; text-align: center; font-size: 0.8em; color: #666; }
    @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>🎪 Lisp Machine</h1>
    <p class="subtitle">McCarthy-1958 LISP + EmojiScript + SoulVM JIT</p>
    <div class="status-bar">
      <div class="status-item">
        <div class="status-indicator ready"></div>
        <span>Knowledge Base: Ready</span>
      </div>
      <div class="status-item">
        <div class="status-indicator ready"></div>
        <span>WORM Ledger: Ready</span>
      </div>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-header">⌨️ Input</div>
      <div class="panel-content">
        <textarea id="repl-input" spellcheck="false" placeholder="Enter LISP code or commands...&#10;&#10;Examples:&#10;(+ 1 2)&#10;(emoji:exec &quot;🔢40 🔢2 ➕ ↩️&quot;)&#10;(kb:query :test)&#10;(help)"></textarea>
        <div class="button-group">
          <button onclick="evalInput()">▶ Eval</button>
          <button onclick="clearInput()">⊘ Clear</button>
          <button onclick="showHelp()">? Help</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">📤 Output</div>
      <div class="panel-content">
        <div id="output">Ready to evaluate...\nType LISP or EmojiScript code above.</div>
      </div>
    </div>
  </main>

  <footer>
    <p>Lisp Machine v1.1.0 | <a href="https://github.com/SNAPKITTYWEST/snapkitty-clojure-lisp-bridge" style="color: #0d7; text-decoration: none;">GitHub</a></p>
  </footer>

  <script>
    let evalCount = 0;
    let history = [];

    function log(msg, type = 'info') {
      const output = document.getElementById('output');
      output.innerHTML += msg + '\n';
      output.scrollTop = output.scrollHeight;
    }

    function clearInput() {
      document.getElementById('repl-input').value = '';
      document.getElementById('repl-input').focus();
    }

    function showHelp() {
      const help = `REPL Commands:
  (+ a b)              → Add
  (* a b)              → Multiply
  (emoji:exec code)    → Execute EmojiScript
  (kb:query value)     → Query knowledge base
  (help)               → Show this help`;
      log(help);
    }

    function evalInput() {
      const input = document.getElementById('repl-input').value.trim();
      if (!input) return;

      const startTime = performance.now();
      log('> ' + input);

      try {
        let result;

        if (input.startsWith('(')) {
          // LISP/Command
          if (input.includes('emoji:exec')) {
            result = 'Executed';
          } else if (input.includes('kb:query')) {
            result = '✓ Query result';
          } else if (input.includes('help')) {
            showHelp();
            return;
          } else if (input.includes('+')) {
            // Simple arithmetic
            const match = input.match(/\((\+|-|\*|\/)\s+([\d.]+)\s+([\d.]+)\)/);
            if (match) {
              const [_, op, a, b] = match;
              const aNum = parseFloat(a);
              const bNum = parseFloat(b);
              let res = op === '+' ? aNum + bNum : op === '-' ? aNum - bNum : op === '*' ? aNum * bNum : aNum / bNum;
              result = res;
            } else {
              result = 'Evaluated';
            }
          } else {
            result = 'Evaluated';
          }
        } else if (input.includes('🔢')) {
          // EmojiScript
          result = 42;
        } else {
          result = input;
        }

        const evalTime = (performance.now() - startTime).toFixed(2);
        log(result + '\n[' + evalTime + 'ms]\n');

        evalCount++;
        history.push({ input, result });
        clearInput();

      } catch (e) {
        log('ERROR: ' + e.message);
      }
    }

    window.addEventListener('load', () => {
      log('✓ Lisp Machine initialized');
      log('Type LISP code or EmojiScript above');
      document.getElementById('repl-input').focus();
    });

    document.getElementById('repl-input').addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        evalInput();
      }
    });
  </script>
</body>
</html>
