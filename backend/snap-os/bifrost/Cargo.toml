[package]
name        = "bifrost"
version     = "0.1.0"
edition     = "2021"
description = "snap-os Merkle-DAG audit chain + WORM_FS. Every cap transfer and JIT compile is sealed as an unforgeable, content-addressed event."

[[bin]]
name = "bifrost"
path = "src/bin/bifrost.rs"

[features]
default  = []
genesis  = []   # enables genesis fixture test harness

[dependencies]
# workspace
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
hex        = { workspace = true }
sha2       = { workspace = true }

# cryptography
blake3          = "1"
ed25519-dalek   = { version = "2", features = ["rand_core"] }
rand            = "0.8"

# storage
sled = "0.34"

# concurrency
crossbeam = "0.8"

# time
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# std::time::SystemTime is available on all non-wasm targets

[dev-dependencies]
tempfile = "3"
