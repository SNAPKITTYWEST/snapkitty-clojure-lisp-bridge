[workspace]
members = [
    "bifrost",
    "bifrost-policy",
    "craft-crypto",
    "soul-agent",
    "soul-bus",
    "soul-narrator",
    "silverback",
    "soulvm",
    "context-hydrator",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
sha2        = "0.10"
hex         = "0.4"

[profile.kernel]
inherits      = "release"
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
