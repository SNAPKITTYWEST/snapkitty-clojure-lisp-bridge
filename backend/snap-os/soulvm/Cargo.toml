[package]
name    = "soulvm"
version = "0.1.0"
edition = "2021"
description = "snap-os agent runtime: Cranelift JIT + Immix GC (stub)"

[dependencies]
silverback         = { path = "../silverback" }
bifrost            = { path = "../bifrost" }
cranelift-codegen  = "0.132.1"
cranelift-frontend = "0.132.1"
cranelift-jit      = "0.132.1"
cranelift-module   = "0.132.1"
cranelift-native   = "0.132.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

[dev-dependencies]
tempfile = "3"
